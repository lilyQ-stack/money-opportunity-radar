name: Money Opportunity Radar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate radar report manually
        run: python scripts/report.py

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Generate opportunity radar report"
          git push
